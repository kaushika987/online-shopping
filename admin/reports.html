<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - Reports</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="nav">
    <a href="inventory.html">Inventory</a>
    <a href="categories.html">Categories</a>
    <a href="customers.html">Customers</a>
    <a href="reports.html">Reports</a>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="page wide">
    <h2>Reports</h2>
    <div class="row">
      <select id="reportType"></select>
      <select id="fCat"><option value="">All categories</option></select>
      <span id="dateWrap">
        <label for="fFrom">From</label> <input type="date" id="fFrom">
        <label for="fTo">To</label> <input type="date" id="fTo">
      </span>
    </div>

    <h3 id="reportTitle"></h3>
    <p id="reportNote" class="report-note"></p>
    <table>
      <thead id="reportHead"></thead>
      <tbody id="reportBody"></tbody>
      <tfoot id="reportFoot"></tfoot>
    </table>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-reports.js"></script>
</body>
</html>

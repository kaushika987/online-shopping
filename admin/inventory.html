<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin - Inventory</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="nav">
    <a href="inventory.html">Inventory</a>
    <a href="categories.html">Categories</a>
    <a href="customers.html">Customers</a>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="page">
    <h2>Inventory</h2>

    <div id="formBox" class="form-box">
      <h3 id="formTitle">Add item</h3>
      <label>Title</label>
      <input type="text" id="fTitle">
      <label>Description</label>
      <textarea id="fDes" rows="2"></textarea>
      <label>Category</label>
      <select id="fCat"><option value="">Choose a category</option></select>
      <label>Quantity</label>
      <input type="number" id="fQty" min="0" step="1">
      <label>Price (₹)</label>
      <input type="number" id="fPrice" min="0" step="0.01">
      <label>Image (under 500 KB)</label>
      <input type="file" id="fImage" accept="image/*">
      <img id="fPreview" class="preview" alt="" style="display:none">
      <div class="form-actions">
        <button id="btnSave">Save</button>
        <button id="btnCancel">Cancel</button>
      </div>
      <p id="formMsg" style="color:#b91c1c"></p>
    </div>

    <div class="row">
      <select id="catFilter"><option value="">All categories</option></select>
      <input type="text" id="search" placeholder="Find by item id or title">
      <button id="btnSearch">Search</button>
      <button id="btnClear">Clear</button>
      <button id="btnNew">+ Add item</button>
    </div>
    <p id="msg"></p>

    <table>
      <thead>
        <tr><th>Image</th><th>ID</th><th>Title</th><th>Category</th><th>Qty</th><th>Price</th><th>Status</th><th>Actions</th></tr>      </thead>
      <tbody id="itemBody"></tbody>
    </table>

    <div class="pager">
      <button id="prev">Previous</button>
      <span id="pageInfo"></span>
      <button id="next">Next</button>
    </div>
  </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-inventory.js"></script>
</body>
</html>

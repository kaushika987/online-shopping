<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
</head>
<body class="shop-body">
  <div id="siteHeader"></div>

  <section class="hero">
    <div class="container hero-inner">
      <div>
        <p class="eyebrow">New season edit</p>
        <h1>Thoughtfully chosen pieces for everyday elegance</h1>
        <p class="lead">Discover handpicked favourites across every category, delivered with care.</p>
        <a class="btn" href="shop.html">Shop Now</a>
      </div>
      <div class="hero-art" id="heroArt"></div>
    </div>
  </section>

  <section class="section container">
    <div class="section-head reveal"><h2>Shop by category</h2><a class="link-more" href="shop.html">View all</a></div>
    <div class="cat-grid" id="catCards"></div>
  </section>

  <section class="section container">
    <div class="section-head reveal"><h2>Best sellers</h2><a class="link-more" href="shop.html">See more</a></div>
    <div class="grid" id="bestSellers"></div>
  </section>

  <section class="container">
    <div class="offer reveal">
      <div>
        <h2>The festive edit</h2>
        <p>Handpicked favourites, wrapped with care.</p>
      </div>
      <a class="btn" href="shop.html">Explore the edit</a>
    </div>
  </section>

  <section class="section container">
    <div class="trust" id="trust"></div>
  </section>

  <div id="siteFooter"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart-store.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/product-card.js"></script>
  <script src="../js/home.js"></script>
</body>
</html>
